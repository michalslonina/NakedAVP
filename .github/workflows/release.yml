name: Release binaries

# Produces deb, rpm, Arch, AppImage and Flatpak from the packaging already in
# this repo (CPack config in CMakeLists.txt, packaging/ for PKGBUILD and the
# Flatpak manifest).
# Distro coverage matches the openSUSE Build Service project. Pushing a v* tag
# additionally attaches everything to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ---------------------------------------------------------------- deb / rpm
  # Both come out of CPack, so packaging lives in one place. Each distro builds
  # in its own container because SDL3 only exists on recent releases.
  packages:
    name: ${{ matrix.distro.name }} (${{ matrix.arch }})
    # aarch64 runners are free for public repositories.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - { name: tumbleweed,   image: 'opensuse/tumbleweed', family: suse,   generator: RPM, ext: rpm }
          - { name: leap-16.0,    image: 'opensuse/leap:16.0',  family: suse,   generator: RPM, ext: rpm }
          - { name: fedora-41,    image: 'fedora:41',           family: fedora, generator: RPM, ext: rpm }
          - { name: fedora-42,    image: 'fedora:42',           family: fedora, generator: RPM, ext: rpm }
          - { name: fedora-43,    image: 'fedora:43',           family: fedora, generator: RPM, ext: rpm }
          - { name: fedora-44,    image: 'fedora:44',           family: fedora, generator: RPM, ext: rpm }
          - { name: debian-13,    image: 'debian:13',           family: deb,    generator: DEB, ext: deb }
          - { name: debian-testing, image: 'debian:testing',    family: deb,    generator: DEB, ext: deb }
          - { name: ubuntu-25.04, image: 'ubuntu:25.04',        family: deb,    generator: DEB, ext: deb }
          - { name: ubuntu-25.10, image: 'ubuntu:25.10',        family: deb,    generator: DEB, ext: deb }
          - { name: ubuntu-26.04, image: 'ubuntu:26.04',        family: deb,    generator: DEB, ext: deb }
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.distro.family == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file \
            libsdl3-dev libopenal-dev libgl1-mesa-dev

      - name: Install dependencies (Fedora)
        if: matrix.distro.family == 'fedora'
        run: |
          dnf install -y gcc gcc-c++ cmake ninja-build rpm-build file \
            SDL3-devel openal-soft-devel mesa-libGL-devel

      - name: Install dependencies (openSUSE)
        if: matrix.distro.family == 'suse'
        run: |
          zypper -n refresh
          zypper -n install gcc gcc-c++ cmake ninja rpm-build file \
            SDL3-devel openal-soft-devel Mesa-libGL-devel

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          cmake --build build

      - name: Package
        working-directory: build
        run: |
          cpack -G ${{ matrix.distro.generator }}
          ls -la *.${{ matrix.distro.ext }}

      - uses: actions/upload-artifact@v6
        with:
          name: nakedavp-${{ matrix.distro.name }}-${{ matrix.arch }}
          if-no-files-found: error
          path: build/*.${{ matrix.distro.ext }}

  # --------------------------------------------------------------- Arch Linux
  # Separate from the CPack matrix because Arch packages are built with
  # makepkg. x86_64 only: Arch Linux proper ships no aarch64 (that is the
  # separate Arch Linux ARM project, with its own images and repositories).
  archlinux:
    name: arch-linux (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git sdl3 openal libglvnd

      - name: Build the package
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          git archive --format=tar.gz --prefix=nakedavp-1.2.3/ \
            -o packaging/nakedavp-1.2.3.tar.gz HEAD
          chown -R builder packaging
          cd packaging
          sudo -u builder makepkg -f --noconfirm
          ls -la *.pkg.tar.zst

      - uses: actions/upload-artifact@v6
        with:
          name: nakedavp-archlinux-x86_64
          if-no-files-found: error
          path: packaging/*.pkg.tar.zst

  # ------------------------------------------------------------------ AppImage
  # Built on the oldest base whose stock gcc can compile our dependencies, with
  # SDL3/OpenAL bundled - see build-appimage.yml for the full reasoning.
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates gpg wget file pkg-config ninja-build \
            libgl1-mesa-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libwayland-dev wayland-protocols
          # 20.04's cmake (3.16) predates the CheckLinkerFlag module openal-soft
          # needs. Build-tool upgrade only - does not affect the binary's deps.
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends cmake

      - name: Build SDL3 and OpenAL from source
        run: |
          git clone --branch release-3.2.20 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_INSTALL_PREFIX=/opt/deps -DSDL_STATIC=OFF -DSDL_SHARED=ON
          cmake --build /tmp/SDL3/build && cmake --install /tmp/SDL3/build
          git clone --branch 1.24.3 --depth 1 https://github.com/kcat/openal-soft.git /tmp/oal
          cmake -S /tmp/oal -B /tmp/oal/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_INSTALL_PREFIX=/opt/deps -DLIBTYPE=SHARED
          cmake --build /tmp/oal/build && cmake --install /tmp/oal/build

      - name: Build NakedAVP and assemble the AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_PREFIX_PATH=/opt/deps
          cmake --build build
          DESTDIR=/tmp/stage cmake --install build --prefix /usr
          mkdir -p AppDir/usr/lib
          cp -r /tmp/stage/usr/* AppDir/usr/
          cp /opt/deps/lib/libSDL3.so* /opt/deps/lib/libopenal.so* AppDir/usr/lib/

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
          VERSION: '1.2.3'
        run: |
          curl -sL -o /tmp/appimagetool https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-947-x86_64.AppImage
          chmod +x /tmp/appimagetool
          PREFIX="$PWD/AppDir/usr" /tmp/appimagetool deploy "$PWD/AppDir/usr/share/applications/nakedavp.desktop"
          /tmp/appimagetool -s "$PWD/AppDir"
          ls -la *.AppImage
          ./*.AppImage --version

      - uses: actions/upload-artifact@v6
        with:
          name: nakedavp-appimage-x86_64
          if-no-files-found: error
          path: '*.AppImage'

  # ------------------------------------------------------------------ Flatpak
  # Both arches, which OBS could not do - it publishes no aarch64 runtimes,
  # whereas flathub does.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build the bundle
        run: |
          sudo flatpak-builder --force-clean --repo=/tmp/repo build-dir \
            packaging/io.github.michalslonina.NakedAVP.yml
          sudo flatpak build-bundle /tmp/repo nakedavp-${{ matrix.arch }}.flatpak \
            io.github.michalslonina.NakedAVP
          ls -la nakedavp-${{ matrix.arch }}.flatpak

      - uses: actions/upload-artifact@v6
        with:
          name: nakedavp-flatpak-${{ matrix.arch }}
          if-no-files-found: error
          path: 'nakedavp-*.flatpak'

  # ------------------------------------------------------------------- release
  release:
    name: Attach to release
    needs: [packages, archlinux, appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.pkg.tar.zst' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
